<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyScore</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .btn { margin-top: 20px; padding: 15px 30px; background-color: #007AFF; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 18px; display: none; }
    </style>
</head>
<body>
    <h2 id="status">Запускаем MoneyScore...</h2>
    <a href="#" class="btn" id="fallback-btn">Открыть приложение</a>

    <script>
        // Актуальная ссылка лежит в Supabase
        const LATEST_URL = "https://motedjnhmgeckscpkejp.supabase.co/storage/v1/object/public/app/latest.txt";

        // Запасная ссылка, если файл не загрузился
        const FALLBACK_LINK = "exps://u.expo.dev/a78711f6-82f5-424f-855e-b1227a48b1a8/group/cd226a5c-548f-40e4-acce-73da0a7f5ff0";

        const path = new URLSearchParams(window.location.search).get('path');

        async function getBaseLink() {
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 2500);
                const res = await fetch(LATEST_URL + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal });
                clearTimeout(timer);
                if (!res.ok) throw new Error(res.status);
                const link = (await res.text()).trim();
                if (link.startsWith("exp")) return link;
            } catch (e) {}
            return FALLBACK_LINK;
        }

        getBaseLink().then((base) => {
            const expoLink = path ? base.replace(/\/+$/, "") + "/--/" + path : base;
            document.getElementById('fallback-btn').href = expoLink;
            window.location.href = expoLink;

            setTimeout(() => {
                document.getElementById('status').innerText = "Нажми кнопку ниже, чтобы открыть";
                document.getElementById('fallback-btn').style.display = "block";
            }, 1000);
        });
    </script>
</body>
</html>
